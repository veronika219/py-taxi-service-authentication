{% extends "base.html" %}


{% block content %}
  <h1>Вхід</h1>

  {% if form.errors %}
    <p class="text-danger">Invalid Credentials</p>
  {% endif %}

  <form action="{% url 'login' %}" method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <input type="submit" value="Login">
    <input type="hidden" name="next" value="{{ next }}">
  </form>

{% endblock %}
